name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Compile check
        working-directory: backend
        run: python -m compileall app
      - name: Run pytest
        working-directory: backend
        run: PYTHONPATH=. pytest tests/ -v --tb=short

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-checks]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            export PATH=$HOME/local/bin:$PATH
            export PYTHONPATH=~/seo-geo-dashboard/backend
            cd ${{ secrets.VPS_PROJECT_PATH }}

            # Pull latest code
            git pull origin main

            # Ensure nginx is installed and configured
            if ! command -v nginx &>/dev/null; then
              sudo dnf install -y nginx
              sudo systemctl enable nginx
            fi
            sudo cp frontend/nginx.conf /etc/nginx/conf.d/default.conf
            sudo nginx -t
            sudo systemctl enable --now nginx
            sudo systemctl reload nginx

            # Install backend deps
            python3.11 -m pip install --user -q -r backend/requirements.txt

            # Build frontend with API URL
            cd frontend
            npm ci
            export VITE_API_URL=http://${{ secrets.VPS_HOST }}:8000
            npm run build
            sudo rm -rf /usr/share/nginx/html/*
            sudo cp -r dist/. /usr/share/nginx/html/
            cd ..

            # Run migrations
            cd backend
            python3.11 -m alembic upgrade head
            cd ..

            # Restart backend
            if systemctl is-active --quiet seo-backend 2>/dev/null; then
              sudo systemctl restart seo-backend
            else
              pkill -f "uvicorn app.main:app" 2>/dev/null || true
              sleep 1
              cd backend
              nohup python3.11 -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/uvicorn.log 2>&1 &
              cd ..
            fi

            echo "✅ Deploy successful! App at http://${{ secrets.VPS_HOST }}"
