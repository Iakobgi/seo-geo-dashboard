name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend deps
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Compile check
        working-directory: backend
        run: python -m compileall app
      - name: Run pytest
        working-directory: backend
        run: PYTHONPATH=. pytest tests/ -v --tb=short
      - name: Test authentication through production proxy
        env:
          DATABASE_URL: sqlite+pysqlite:////tmp/seo-proxy-test.db
          SECRET_KEY: ci-only-proxy-test-secret
        run: |
          sudo apt-get update
          sudo apt-get install -y nginx
          PYTHONPATH=backend python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 &
          backend_pid=$!
          trap 'kill "$backend_pid"' EXIT
          sed 's/listen 80;/listen 8080;/' frontend/nginx.conf | sudo tee /etc/nginx/conf.d/seo-proxy-test.conf >/dev/null
          sudo nginx -t
          sudo systemctl restart nginx
          for attempt in $(seq 1 30); do
            if curl --fail --silent --max-time 2 http://127.0.0.1:8000/health >/dev/null; then
              break
            fi
            sleep 1
          done
          python scripts/check_deployment.py http://localhost:8080/api --test-auth
      - name: Verify schema migrations
        working-directory: backend
        env:
          DATABASE_URL: sqlite+pysqlite:////tmp/seo-migrations-test.db
          SECRET_KEY: ci-only-migration-secret
        run: PYTHONPATH=. python -m alembic upgrade head

  frontend-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  deploy:
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-checks]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: dist
      - name: Upload tested frontend to Oracle
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: dist/*
          target: ${{ secrets.VPS_PROJECT_PATH }}/.deployment/frontend-${{ github.sha }}
          strip_components: 1
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_DATABASE_URL_B64: ${{ secrets.DEPLOY_DATABASE_URL_B64 }}
          DEPLOY_AI_KEY_B64: ${{ secrets.DEPLOY_AI_KEY_B64 }}
          DEPLOY_COMMIT: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DEPLOY_DATABASE_URL_B64,DEPLOY_AI_KEY_B64,DEPLOY_COMMIT
          script: |
            set -e
            export PATH="$HOME/.local/bin:$PATH"
            cd "${{ secrets.VPS_PROJECT_PATH }}"
            export PYTHONPATH="$PWD/backend"

            # Preserve a local rollback point before updating code or configuration.
            mkdir -p .deployment/backups
            chmod 700 .deployment .deployment/backups
            git rev-parse HEAD > .deployment/previous-release
            if [ -f backend/.env ]; then
              cp backend/.env ".deployment/backups/backend-env-$(date +%Y%m%d%H%M%S)"
              chmod 600 .deployment/backups/backend-env-*
            fi

            # Pull latest code
            git fetch origin main
            git merge --ff-only "$DEPLOY_COMMIT"

            # Fail before publishing frontend/config changes if the DB is unavailable.
            python3.11 -m pip install --user -q -r backend/requirements.txt
            python3.11 - <<'PY'
            import base64, json, os, re, secrets
            from pathlib import Path
            from dotenv import dotenv_values
            path = Path('backend/.env')
            source = path.read_text() if path.exists() else ''
            updates = {}
            for secret_name, setting in [('DEPLOY_DATABASE_URL_B64', 'DATABASE_URL'), ('DEPLOY_AI_KEY_B64', 'OPENROUTER_API_KEY')]:
                value = os.environ.get(secret_name, '')
                if not value:
                    raise SystemExit('Required encrypted deployment configuration is missing')
                updates[setting] = base64.b64decode(value, validate=True).decode()
            values = dotenv_values(path) if path.exists() else {}
            key = values.get('SECRET_KEY') or ''
            if len(key) < 32 or key == 'dev-secret-change-me':
                updates['SECRET_KEY'] = secrets.token_urlsafe(48)
            for name, value in updates.items():
                line = name + '=' + json.dumps(value)
                pattern = r'(?m)^\s*' + re.escape(name) + r'\s*=.*$'
                if re.search(pattern, source):
                    source = re.sub(pattern, lambda _: line, source)
                else:
                    source += '\n' + line + '\n'
            path.write_text(source)
            path.chmod(0o600)
            print('Backend configuration updated; secret values suppressed')
            PY
            cd backend
            python3.11 -m alembic upgrade head
            cd ..

            # Publish precisely the frontend that passed CI; no Node upgrade on VPS needed.
            test -f ".deployment/frontend-$DEPLOY_COMMIT/index.html"

            # Ensure nginx is installed and configured
            if ! command -v nginx &>/dev/null; then
                if command -v apt-get &>/dev/null; then
                    sudo apt-get update
                    sudo apt-get install -y nginx
                elif command -v dnf &>/dev/null; then
                    sudo dnf install -y nginx
                else
                    echo "Unable to install nginx: no supported package manager found"
                    exit 1
                fi
                sudo systemctl enable nginx
            fi

            # Oracle Linux/RHEL require this permission for Nginx reverse proxying.
            # Keep SELinux enabled; authorize the web server's network connections.
            if command -v getenforce >/dev/null && [ "$(getenforce)" != "Disabled" ]; then
                sudo setsebool -P httpd_can_network_connect on
            fi

            sudo cp frontend/nginx.conf /etc/nginx/conf.d/default.conf
            sudo nginx -t
            sudo systemctl enable --now nginx
            sudo systemctl reload nginx

            # Keep old hashed assets available for already-open browser tabs.
            sudo cp -r ".deployment/frontend-$DEPLOY_COMMIT/." /usr/share/nginx/html/

            # Restart backend
            if systemctl cat seo-backend >/dev/null 2>&1; then
              sudo systemctl restart seo-backend
            else
              pkill -f "[u]vicorn app.main:app" 2>/dev/null || true
              sleep 1
              cd backend
              nohup python3.11 -m uvicorn app.main:app --host 0.0.0.0 --port 8000 < /dev/null > /tmp/uvicorn.log 2>&1 &
              cd ..
            fi

            for attempt in $(seq 1 30); do
                if curl --fail --silent --max-time 5 http://127.0.0.1:8000/health/ready >/dev/null; then
                    break
                fi
                sleep 1
            done

            python3.11 scripts/check_deployment.py http://127.0.0.1/api
            (cd backend && python3.11 ../scripts/check_deployment.py http://127.0.0.1/api --test-auth --cleanup-auth)

            echo "✅ Deploy successful! App at http://${{ secrets.VPS_HOST }}"
