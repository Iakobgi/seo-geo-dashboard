version: '3.8'
# Production: backend + frontend on Oracle Cloud free VM.
# Database runs on Supabase (free tier, external).
# No local PostgreSQL container needed.

services:
  backend:
    image: ${DOCKER_USERNAME}/seo-geo-backend:latest
    container_name: seo_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"

  frontend:
    image: ${DOCKER_USERNAME}/seo-geo-frontend:latest
    container_name: seo_frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
